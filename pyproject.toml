[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "synthetic-image-generator"
dynamic = ["version"]
description = "Deterministic indexed image generator with composable scenes, alpha, and raster conversion"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "threadpoolctl>=3.1",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Multimedia :: Graphics",
]

[project.optional-dependencies]
visualization = [
    "matplotlib>=3.7",
    "Pillow>=9.5",
]
gpu = [
    "wgpu>=0.32,<0.33",
]
dev = [
    "build>=1.2",
    "coverage[toml]>=7",
    "pytest>=8",
]

[tool.setuptools]
packages = ["synthetic_image_generator"]

[tool.setuptools.package-dir]
synthetic_image_generator = "generators"

[tool.setuptools.dynamic]
version = {attr = "synthetic_image_generator._version.__version__"}

[tool.setuptools.package-data]
synthetic_image_generator = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["synthetic_image_generator"]

[tool.coverage.report]
show_missing = true
skip_covered = true
