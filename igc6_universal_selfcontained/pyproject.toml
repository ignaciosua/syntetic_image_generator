[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "synthetic-image-generator"
version = "0.2.0"
description = "Deterministic indexed image generator with composable scenes, alpha, and raster conversion"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Multimedia :: Graphics",
]

[project.optional-dependencies]
visualization = [
    "matplotlib>=3.7",
    "Pillow>=9.5",
]
dev = [
    "build>=1.2",
    "pytest>=8",
]

[tool.setuptools]
packages = ["synthetic_image_generator"]

[tool.setuptools.package-dir]
synthetic_image_generator = "generators"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
